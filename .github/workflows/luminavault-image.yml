name: LuminaVault Hermes Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - gateway/**
      - agent/**
      - hermes_cli/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/luminavault-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: luminavault-hermes-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/luminavault/luminavault-hermes-agent:main
            ghcr.io/luminavault/luminavault-hermes-agent:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=luminavault-hermes-amd64
          cache-to: type=gha,mode=max,scope=luminavault-hermes-amd64
