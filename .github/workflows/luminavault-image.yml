name: LuminaVault Hermes Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - gateway/**
      - agent/**
      - hermes_cli/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/luminavault-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: luminavault-hermes-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/luminavault/luminavault-hermes-agent:main
            ghcr.io/luminavault/luminavault-hermes-agent:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=luminavault-hermes-amd64
          cache-to: type=gha,mode=max,scope=luminavault-hermes-amd64
